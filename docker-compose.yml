version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: capsule-postgres
    environment:
      POSTGRES_DB: capsule_db
      POSTGRES_USER: capsule_user
      POSTGRES_PASSWORD: capsule_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/src/schema/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capsule_user -d capsule_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: capsule-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capsule-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://capsule_user:capsule_secure_password@postgres:5432/capsule_db
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
